[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-mamba-lab"
version = "0.1.0"
description = "UltraLight VM-UNet reproduction and controlled sampling experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "scipy>=1.10", "Pillow>=10", "PyYAML>=6", "einops>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
skin-mamba = "skinmamba.cli:main"

[tool.setuptools.packages.find]
include = ["skinmamba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
